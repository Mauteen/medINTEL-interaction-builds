<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Join Waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:  #22C55E;
  --ease:   cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

body {
  font-family: 'Jost', sans-serif;
  background: #0d0d0c;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Card ── */
.card {
  width: 440px;
  background: #1a1a19;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 8px;
  position: relative;
  overflow: hidden;

  opacity: 0;
  transform: translateY(40px) scale(0.95);
  animation: cardIn 0.7s var(--ease) 0.15s forwards;
}
@keyframes cardIn {
  to { opacity: 1; transform: none; }
}

/* ── Hero block ── */
.card-hero {
  background: #111110;
  border-radius: 12px;
  padding: 36px 28px 32px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.social-proof {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.18);
  border-radius: 999px;
  padding: 5px 12px 5px 6px;
  opacity: 0;
  transform: translateY(12px);
  animation: lineIn 0.45s var(--ease) 0.6s forwards;
}
.avatars {
  display: flex;
}
.avatar {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid #111110;
  background: #2a2a29;
  margin-left: -5px;
  font-size: 9px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5);
  overflow: hidden;
  flex-shrink: 0;
}
.avatar:first-child { margin-left: 0; }
.avatar img, .spot-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.proof-text {
  font-size: 12px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: 0.01em;
}

.card-title {
  font-size: 34px;
  font-weight: 700;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.02em;
  opacity: 0;
  transform: translateY(16px);
  animation: lineIn 0.48s var(--ease) 0.72s forwards;
}
.card-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.42);
  line-height: 1.65;
  max-width: 300px;
  opacity: 0;
  transform: translateY(14px);
  animation: lineIn 0.48s var(--ease) 0.84s forwards;
}
@keyframes lineIn {
  to { opacity: 1; transform: none; }
}

/* ── Form section ── */
.card-form {
  padding: 18px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  opacity: 0;
  transform: translateY(12px);
  animation: lineIn 0.48s var(--ease) 0.96s forwards;
}
.form-label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.35);
  text-align: center;
  letter-spacing: 0.01em;
}

.input-row {
  background: #171717;
  border: 1px solid #323232;
  border-radius: 12px;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 6px 6px 6px 16px;
  gap: 8px;
  transition: border-color 0.2s ease;
}
.input-row:focus-within { border-color: rgba(34,197,94,0.3); }

.input-row input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  color: #fff;
  min-width: 0;
}
.input-row input::placeholder { color: #3d3d3c; }
.input-row input:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Subscribe button ── */
.btn-wrap {
  position: relative;
  flex-shrink: 0;
}

.btn-subscribe {
  position: relative;
  height: 40px;
  padding: 0 14px;
  background: var(--green);
  border: none;
  border-radius: 12px;
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #0d0d0c;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: background 0.2s, transform 0.15s ease, opacity 0.2s;
  overflow: hidden;
}
.btn-subscribe:hover:not(:disabled) { background: #16a34a; transform: scale(1.03); }
.btn-subscribe:active:not(:disabled) { transform: scale(0.96); }

.btn-subscribe.launched {
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-icon svg {
  display: block;
  width: 15px; height: 15px;
  fill: none;
  stroke: #0d0d0c;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Flying mail ── */
.flying-mail-x {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
}
.flying-mail-y {
  display: flex;
  align-items: center;
  justify-content: center;
}
.flying-mail-y svg {
  filter: drop-shadow(0 0 12px rgba(34,197,94,0.9)) drop-shadow(0 0 32px rgba(34,197,94,0.4));
}

/* shake on ignition */
@keyframes ignite {
  0%   { transform: translate(-50%, -50%) rotate(0deg); }
  20%  { transform: translate(calc(-50% - 3px), calc(-50% + 2px)) rotate(-4deg); }
  40%  { transform: translate(calc(-50% + 3px), calc(-50% - 2px)) rotate(3deg); }
  60%  { transform: translate(calc(-50% - 2px), calc(-50% + 1px)) rotate(-2deg); }
  80%  { transform: translate(calc(-50% + 2px), calc(-50% - 1px)) rotate(2deg); }
  100% { transform: translate(-50%, -50%) rotate(0deg); }
}

/* ── Impact burst ── */
.burst-dot {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
}

/* shockwave ring */
.shockwave {
  position: fixed;
  border-radius: 50%;
  border: 2px solid rgba(34,197,94,0.7);
  pointer-events: none;
  z-index: 9996;
  transform: translate(-50%, -50%) scale(0);
}

/* ── Confirmed state ── */
.confirmed-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  padding: 40px 28px 32px;
  background: #1a1a19;
  border-radius: 22px;
  clip-path: circle(0px at 50% 50%);
  pointer-events: none;
}

.mail-landed {
  width: 64px; height: 64px;
  border-radius: 18px;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.4);
  animation: none;
}
.mail-landed svg {
  width: 32px; height: 32px;
  stroke: var(--green);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.confirmed-title {
  font-size: 30px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
  opacity: 0;
  transform: translateY(12px);
}
.confirmed-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  line-height: 1.4;
  max-width: 280px;
  opacity: 0;
  transform: translateY(10px);
}
.confirmed-spot {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.15);
  border-radius: 999px;
  padding: 6px 16px 6px 8px;
  opacity: 0;
  transform: translateY(8px);
}
.spot-avatars {
  display: flex;
}
.spot-avatar {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid #1a1a19;
  background: #2a2a29;
  margin-left: -5px;
  font-size: 7px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5);
  overflow: hidden;
}
.spot-avatar:first-child { margin-left: 0; }
.spot-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
}

.card.confirmed .confirmed-state { pointer-events: auto; }

/* trail dot */
.trail {
  position: fixed;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(34,197,94,0.5);
  pointer-events: none;
  z-index: 9997;
}
</style>
</head>
<body>

<div class="card" id="card">

  <div class="card-hero" id="cardHero">
    <div class="social-proof">
      <div class="avatars">
        <div class="avatar"><img src="https://www.figma.com/api/mcp/asset/e60d8031-c9ca-48d4-b5f5-98572a575c17.png" alt=""></div>
        <div class="avatar"><img src="https://www.figma.com/api/mcp/asset/1670a7ec-8725-41ee-aa91-50a9a17ab4e0.png" alt=""></div>
        <div class="avatar"><img src="https://www.figma.com/api/mcp/asset/47e61762-6158-4e2b-8f60-176eebcd4ca9.png" alt=""></div>
      </div>
      <span class="proof-text">10,247 already joined</span>
    </div>
    <h1 class="card-title">Join the Waitlist</h1>
    <p class="card-sub">Get early access and enjoy premium benefits before everyone else.</p>
  </div>

  <div class="card-form" id="cardForm">
    <p class="form-label">Subscribe to our newsletter today</p>
    <div class="input-row">
      <input type="email" id="emailInput" placeholder="Enter your email" autocomplete="off"/>
      <div class="btn-wrap">
        <button class="btn-subscribe" id="btn" onclick="handleSubmit()">
          Subscribe
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="confirmed-state" id="confirmedState">
    <div class="mail-landed" id="mailLanded">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <polyline points="2,4 12,13 22,4"/>
        <line x1="2" y1="20" x2="8" y2="14"/>
        <line x1="22" y1="20" x2="16" y2="14"/>
      </svg>
    </div>
    <h2 class="confirmed-title" id="confirmedTitle">You're on the list</h2>
    <p class="confirmed-sub" id="confirmedSub">We'll reach out the moment early access opens. Watch your inbox.</p>
    <div class="confirmed-spot" id="confirmedSpot">
      <div class="spot-avatars">
        <div class="spot-avatar"><img src="https://www.figma.com/api/mcp/asset/317663d3-0114-41d9-9237-e263a202e08a.png" alt=""></div>
        <div class="spot-avatar"><img src="https://www.figma.com/api/mcp/asset/f70f91d7-f997-4c48-be2c-99fbe8cb00df.png" alt=""></div>
        <div class="spot-avatar"><img src="https://www.figma.com/api/mcp/asset/35939601-b444-436d-9f8d-0437c2105121.png" alt=""></div>
      </div>
      <span class="spot-text">Your spot is 10,248</span>
    </div>
  </div>

</div>

<script>
const btn   = document.getElementById('btn');
const input = document.getElementById('emailInput');
const card  = document.getElementById('card');

let busy = false;

function lerp(a, b, t) { return a + (b - a) * t; }

// Cubic ease-in: slow start → fast end (rocket acceleration feel)
function easeIn(t) { return t * t * t; }
// Ease-out for X drift
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

// Position for exhaust — mirrors the X locking logic in flyMail
function rocketPos(t, sx, sy, ex, ey) {
  const ARC = -330;
  let x;
  if (t < 0.46) {
    x = sx;                                           // straight up
  } else if (t < 0.65) {
    x = sx + (ex - sx) * ((t - 0.46) / 0.19);       // shift during flip
  } else {
    x = ex;                                           // straight down
  }
  const y = sy + (ey - sy) * t + ARC * Math.sin(Math.PI * t);
  return { x, y };
}

function spawnExhaust(x, y, ascending) {
  const count = ascending ? 4 : 3;
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    const size = 3 + Math.random() * 5;
    const col  = Math.random() > 0.4 ? '#22C55E' : (Math.random() > 0.5 ? '#86efac' : '#fff');
    d.style.cssText = `
      position:fixed; border-radius:50%; pointer-events:none; z-index:9997;
      width:${size}px; height:${size}px;
      left:${x + (Math.random()-0.5)*12}px;
      top:${y + (Math.random()-0.5)*8}px;
      background:${col};
    `;
    document.body.appendChild(d);
    const driftX = (Math.random()-0.5)*14;
    // Exhaust always opposite to travel: up→drift down, down→drift up
    const driftY = ascending ? (22 + Math.random()*26) : -(22 + Math.random()*26);
    d.animate([
      { transform: `translate(-50%,-50%) scale(1)`, opacity: 0.85 },
      { transform: `translate(calc(-50% + ${driftX}px), calc(-50% + ${driftY}px)) scale(0)`, opacity: 0 }
    ], { duration: 260 + Math.random()*140, easing: 'ease-out', fill: 'forwards' })
    .onfinish = () => d.remove();
  }
}

function spawnBurst(cx, cy) {
  // Big particle ring
  const count = 18;
  for (let i = 0; i < count; i++) {
    const d   = document.createElement('div');
    d.className = 'burst-dot';
    const angle = (i / count) * Math.PI * 2;
    const dist  = 36 + Math.random() * 48;
    const tx    = Math.cos(angle) * dist;
    const ty    = Math.sin(angle) * dist;
    const size  = 3 + Math.random() * 6;
    const col   = ['#22C55E','#86efac','#ffffff','#4ade80'][Math.floor(Math.random()*4)];
    d.style.cssText = `
      width:${size}px; height:${size}px;
      left:${cx}px; top:${cy}px;
      background:${col};
      transform:translate(-50%,-50%);
    `;
    document.body.appendChild(d);
    d.animate([
      { transform: `translate(-50%,-50%) scale(1)`, opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
    ], { duration: 500 + Math.random()*250, easing: 'cubic-bezier(0,0,0.2,1)', fill: 'forwards' })
    .onfinish = () => d.remove();
  }

  // Shockwave ring
  const ring = document.createElement('div');
  ring.className = 'shockwave';
  ring.style.cssText = `left:${cx}px; top:${cy}px; width:20px; height:20px;`;
  document.body.appendChild(ring);
  ring.animate([
    { transform: 'translate(-50%,-50%) scale(0)', opacity: 1 },
    { transform: 'translate(-50%,-50%) scale(8)', opacity: 0 }
  ], { duration: 600, easing: 'cubic-bezier(0,0,0.3,1)', fill: 'forwards' })
  .onfinish = () => ring.remove();
}

function revealSuccess(vpX, vpY) {
  const cardRect = card.getBoundingClientRect();
  // Landing point in card-local coordinates (origin = card top-left, inside padding)
  const lx = vpX - cardRect.left;
  const ly = vpY - cardRect.top;

  const confirmed = document.getElementById('confirmedState');

  // Snap clip-path origin to landing point, then bloom outward
  confirmed.style.clipPath = `circle(0px at ${lx}px ${ly}px)`;
  confirmed.style.transition = 'none';

  // Flash the card on impact
  card.style.transition = 'filter 0.08s ease';
  card.style.filter = 'brightness(2.2)';
  setTimeout(() => {
    card.style.transition = 'filter 0.25s ease';
    card.style.filter = '';
  }, 80);

  // One rAF to let browser apply the 0px start, then animate
  requestAnimationFrame(() => requestAnimationFrame(() => {
    confirmed.style.transition = 'clip-path 0.7s cubic-bezier(0.22, 1, 0.36, 1)';
    confirmed.style.clipPath   = `circle(800px at ${lx}px ${ly}px)`;
  }));

  card.classList.add('confirmed');

  // Stagger content in while circle is still expanding
  const show = (id, delay) => {
    const e = document.getElementById(id);
    if (!e) return;
    setTimeout(() => {
      e.style.transition = 'opacity 0.4s cubic-bezier(.22,1,.36,1), transform 0.4s cubic-bezier(.22,1,.36,1)';
      e.style.opacity   = '1';
      e.style.transform = 'none';
    }, delay);
  };

  const landed = document.getElementById('mailLanded');
  setTimeout(() => {
    landed.style.transition = 'opacity 0.3s ease, transform 0.5s cubic-bezier(0.34,1.56,0.64,1)';
    landed.style.opacity    = '1';
    landed.style.transform  = 'scale(1)';
  }, 180);

  show('confirmedTitle', 300);
  show('confirmedSub',   420);
  show('confirmedSpot',  520);
}

function flyMail() {
  const btnRect  = btn.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();

  const startX = btnRect.left  + btnRect.width  / 2;
  const startY = btnRect.top   + btnRect.height / 2;
  const endX   = cardRect.left + cardRect.width  / 2;
  const endY   = cardRect.top  + cardRect.height / 2;

  const DURATION = 1200;
  const PEAK     = -340;
  const dX       = endX - startX;
  const dY       = endY - startY;

  const mx = document.createElement('div');
  mx.className = 'flying-mail-x';
  mx.style.cssText = `left:${startX}px; top:${startY}px;`;

  const my = document.createElement('div');
  my.className = 'flying-mail-y';
  my.innerHTML = `
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none"
         stroke="#22C55E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>`;

  mx.appendChild(my);
  document.body.appendChild(mx);

  // X: locked during ascent (goes straight up), shifts to target DURING the flip,
  // then locked again for descent (straight down) — both legs are perfectly vertical
  mx.animate([
    { transform: 'translateX(-50%)',                          offset: 0    },
    { transform: 'translateX(-50%)',                          offset: 0.46 },
    { transform: `translateX(calc(-50% + ${dX}px))`,         offset: 0.65 },
    { transform: `translateX(calc(-50% + ${dX}px))`,         offset: 1    },
  ], { duration: DURATION, easing: 'linear', fill: 'forwards' });

  // Helper: gravity easeIn for descent — t goes 0→1, returns 0→1 with slow-top/fast-bottom
  const g = t => t * t * t; // cubic ease-in = gravity feel

  // Descent starts at offset 0.65, so map into it
  const descY = f => PEAK + (dY - PEAK) * g(f);

  const yAnim = my.animate([
    // ── Ascent: rotate(-45deg) = nose pointing exactly straight up ──
    { transform: 'translateY(-50%) rotate(-45deg) scale(1)',                               offset: 0    },
    { transform: `translateY(calc(-50% - 55px)) rotate(-45deg) scale(1.08)`,              offset: 0.09 },
    { transform: `translateY(calc(-50% + ${PEAK*0.58}px)) rotate(-45deg) scale(1.15)`,    offset: 0.28 },
    { transform: `translateY(calc(-50% + ${PEAK*0.93}px)) rotate(-45deg) scale(1.19)`,    offset: 0.40 },
    // ── Peak — hang a moment pointing straight up ──
    { transform: `translateY(calc(-50% + ${PEAK}px)) rotate(-45deg) scale(1.21)`,         offset: 0.46 },
    { transform: `translateY(calc(-50% + ${PEAK}px)) rotate(-45deg) scale(1.21)`,         offset: 0.50 },
    // ── Smooth 180° flip: -45° → 135° (total 180°) ──
    { transform: `translateY(calc(-50% + ${PEAK*0.99}px)) rotate(15deg) scale(1.19)`,     offset: 0.54 },
    { transform: `translateY(calc(-50% + ${PEAK*0.98}px)) rotate(80deg) scale(1.17)`,     offset: 0.59 },
    { transform: `translateY(calc(-50% + ${PEAK*0.97}px)) rotate(135deg) scale(1.17)`,    offset: 0.64 },
    // ── Nosedive: rotate(135deg) = nose pointing exactly straight down ──
    { transform: `translateY(calc(-50% + ${descY(0.10)}px)) rotate(135deg) scale(1.16)`,  offset: 0.68 },
    { transform: `translateY(calc(-50% + ${descY(0.22)}px)) rotate(135deg) scale(1.13)`,  offset: 0.73 },
    { transform: `translateY(calc(-50% + ${descY(0.42)}px)) rotate(135deg) scale(1.08)`,  offset: 0.80 },
    { transform: `translateY(calc(-50% + ${descY(0.66)}px)) rotate(135deg) scale(1.02)`,  offset: 0.87 },
    { transform: `translateY(calc(-50% + ${descY(0.86)}px)) rotate(135deg) scale(0.96)`,  offset: 0.93 },
    // ── Impact ──
    { transform: `translateY(calc(-50% + ${dY}px)) rotate(135deg) scale(0.88)`,           offset: 1    },
  ], { duration: DURATION, easing: 'linear', fill: 'forwards' });

  // Exhaust: tracks rocket, flips direction after the 180° turn
  const startTime = performance.now();
  let exhaustFrame;

  function exhaustLoop(now) {
    const t   = Math.min((now - startTime) / DURATION, 1);
    const pos = rocketPos(t, startX, startY, endX, endY);
    const inFlip = t > 0.49 && t < 0.65; // pause exhaust during the smooth flip
    if (!inFlip) spawnExhaust(pos.x, pos.y, t < 0.52);
    if (t < 1) exhaustFrame = requestAnimationFrame(exhaustLoop);
  }
  exhaustFrame = requestAnimationFrame(exhaustLoop);

  yAnim.onfinish = () => {
    cancelAnimationFrame(exhaustFrame);
    spawnBurst(endX, endY);
    revealSuccess(endX, endY);

    // Rocket pops and fades at impact
    my.animate([
      { transform: `translateY(calc(-50% + ${dY}px)) rotate(135deg) scale(0.88)`, opacity: 1   },
      { transform: `translateY(calc(-50% + ${dY}px)) rotate(135deg) scale(1.5)`,  opacity: 0.5, offset: 0.3 },
      { transform: `translateY(calc(-50% + ${dY}px)) rotate(135deg) scale(0)`,    opacity: 0   },
    ], { duration: 400, easing: 'cubic-bezier(0.34,1.56,0.64,1)', fill: 'forwards' })
    .onfinish = () => mx.remove();
  };
}

function handleSubmit() {
  if (busy) return;
  busy = true;

  input.disabled = true;

  // Ignition shake on the button before it disappears
  btn.animate([
    { transform: 'scale(1) translateX(0)' },
    { transform: 'scale(1.06) translateX(-2px)' },
    { transform: 'scale(1.06) translateX(2px)' },
    { transform: 'scale(1.06) translateX(-2px)' },
    { transform: 'scale(1.06) translateX(0)' },
  ], { duration: 180, easing: 'linear' })
  .onfinish = () => {
    btn.classList.add('launched');
    setTimeout(flyMail, 60);
  };
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});
</script>
</body>
</html>
