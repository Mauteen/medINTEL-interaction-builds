<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Join Waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:  #22C55E;
  --ease:   cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

body {
  font-family: 'Jost', sans-serif;
  background: #0d0d0c;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Card ── */
.card {
  width: 440px;
  background: #1a1a19;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 24px;
  padding: 10px;
  position: relative;

  opacity: 0;
  transform: translateY(40px) scale(0.95);
  animation: cardIn 0.7s var(--ease) 0.15s forwards;
}
@keyframes cardIn {
  to { opacity: 1; transform: none; }
}

/* ── Hero block ── */
.card-hero {
  background: #111110;
  border-radius: 18px;
  padding: 36px 28px 32px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.social-proof {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.18);
  border-radius: 999px;
  padding: 5px 12px 5px 6px;
  opacity: 0;
  transform: translateY(12px);
  animation: lineIn 0.45s var(--ease) 0.6s forwards;
}
.avatars {
  display: flex;
}
.avatar {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid #111110;
  background: #2a2a29;
  margin-left: -5px;
  font-size: 9px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5);
}
.avatar:first-child { margin-left: 0; }
.proof-text {
  font-size: 12px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: 0.01em;
}

.card-title {
  font-size: 34px;
  font-weight: 700;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.02em;
  opacity: 0;
  transform: translateY(16px);
  animation: lineIn 0.48s var(--ease) 0.72s forwards;
}
.card-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.42);
  line-height: 1.65;
  max-width: 300px;
  opacity: 0;
  transform: translateY(14px);
  animation: lineIn 0.48s var(--ease) 0.84s forwards;
}
@keyframes lineIn {
  to { opacity: 1; transform: none; }
}

/* ── Form section ── */
.card-form {
  padding: 18px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  opacity: 0;
  transform: translateY(12px);
  animation: lineIn 0.48s var(--ease) 0.96s forwards;
}
.form-label {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.3);
  text-align: center;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.input-row {
  background: #111110;
  border: 1px solid #272727;
  border-radius: 16px;
  height: 54px;
  display: flex;
  align-items: center;
  padding: 6px 6px 6px 16px;
  gap: 8px;
  transition: border-color 0.2s ease;
}
.input-row:focus-within { border-color: rgba(34,197,94,0.3); }

.input-row input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  color: #fff;
  min-width: 0;
}
.input-row input::placeholder { color: #3d3d3c; }
.input-row input:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Subscribe button ── */
.btn-wrap {
  position: relative;
  flex-shrink: 0;
}

.btn-subscribe {
  position: relative;
  height: 42px;
  padding: 0 20px;
  background: var(--green);
  border: none;
  border-radius: 12px;
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #0d0d0c;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: background 0.2s, transform 0.15s ease, opacity 0.2s;
  overflow: hidden;
}
.btn-subscribe:hover:not(:disabled) { background: #16a34a; transform: scale(1.03); }
.btn-subscribe:active:not(:disabled) { transform: scale(0.96); }

.btn-subscribe.launched {
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.btn-icon svg {
  width: 15px; height: 15px;
  fill: none;
  stroke: #0d0d0c;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Flying mail ── */
.flying-mail-x {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
}
.flying-mail-y {
  display: flex;
  align-items: center;
  justify-content: center;
}
.flying-mail-y svg {
  filter: drop-shadow(0 4px 16px rgba(34,197,94,0.5));
}

/* ── Impact burst ── */
.burst-dot {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
}

/* ── Confirmed state ── */
.confirmed-state {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  padding: 40px 28px 32px;
}

.mail-landed {
  width: 64px; height: 64px;
  border-radius: 18px;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.4);
  animation: none;
}
.mail-landed svg {
  width: 32px; height: 32px;
  stroke: var(--green);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.confirmed-title {
  font-size: 30px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
  opacity: 0;
  transform: translateY(12px);
}
.confirmed-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  line-height: 1.65;
  max-width: 280px;
  opacity: 0;
  transform: translateY(10px);
}
.confirmed-spot {
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.15);
  border-radius: 999px;
  padding: 6px 16px;
  opacity: 0;
  transform: translateY(8px);
}

.card.confirmed .card-hero,
.card.confirmed .card-form { display: none; }
.card.confirmed .confirmed-state { display: flex; }

/* trail dot */
.trail {
  position: fixed;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(34,197,94,0.5);
  pointer-events: none;
  z-index: 9997;
}
</style>
</head>
<body>

<div class="card" id="card">

  <div class="card-hero" id="cardHero">
    <div class="social-proof">
      <div class="avatars">
        <div class="avatar">M</div>
        <div class="avatar">K</div>
        <div class="avatar">T</div>
      </div>
      <span class="proof-text">10,247 already joined</span>
    </div>
    <h1 class="card-title">Join the Waitlist</h1>
    <p class="card-sub">Get early access and enjoy premium benefits before everyone else.</p>
  </div>

  <div class="card-form" id="cardForm">
    <p class="form-label">Enter your email to reserve a spot</p>
    <div class="input-row">
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="off"/>
      <div class="btn-wrap">
        <button class="btn-subscribe" id="btn" onclick="handleSubmit()">
          Subscribe
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="confirmed-state" id="confirmedState">
    <div class="mail-landed" id="mailLanded">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <polyline points="2,4 12,13 22,4"/>
        <line x1="2" y1="20" x2="8" y2="14"/>
        <line x1="22" y1="20" x2="16" y2="14"/>
      </svg>
    </div>
    <h2 class="confirmed-title" id="confirmedTitle">You're on the list</h2>
    <p class="confirmed-sub" id="confirmedSub">We'll reach out the moment early access opens. Watch your inbox.</p>
    <span class="confirmed-spot" id="confirmedSpot">✓ &nbsp;Spot #10,248 reserved</span>
  </div>

</div>

<script>
const btn   = document.getElementById('btn');
const input = document.getElementById('emailInput');
const card  = document.getElementById('card');

let busy = false;

function lerp(a, b, t) { return a + (b - a) * t; }

function spawnBurst(cx, cy) {
  const count = 10;
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    dot.className = 'burst-dot';
    const angle = (i / count) * Math.PI * 2;
    const dist  = 28 + Math.random() * 32;
    const tx    = Math.cos(angle) * dist;
    const ty    = Math.sin(angle) * dist;
    const size  = 4 + Math.random() * 4;
    const hue   = Math.random() > 0.5 ? '#22C55E' : '#86efac';
    dot.style.cssText = `
      width:${size}px; height:${size}px;
      left:${cx - size/2}px; top:${cy - size/2}px;
      background:${hue};
    `;
    document.body.appendChild(dot);
    dot.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${tx}px,${ty}px) scale(0)`, opacity: 0 }
    ], { duration: 550 + Math.random()*200, easing: 'cubic-bezier(0,0,0.2,1)', fill: 'forwards' })
    .onfinish = () => dot.remove();
  }
}

function revealSuccess() {
  const el = (id, delay, extra='') => {
    const e = document.getElementById(id);
    if (e) {
      setTimeout(() => {
        e.style.transition = `opacity 0.45s cubic-bezier(.22,1,.36,1) ${extra}, transform 0.45s cubic-bezier(.22,1,.36,1) ${extra}`;
        e.style.opacity = '1';
        e.style.transform = 'none';
      }, delay);
    }
  };

  const landed = document.getElementById('mailLanded');
  landed.style.transition = 'opacity 0.35s var(--ease), transform 0.5s cubic-bezier(0.34,1.56,0.64,1)';
  landed.style.opacity = '1';
  landed.style.transform = 'scale(1)';

  el('confirmedTitle', 180);
  el('confirmedSub',   310);
  el('confirmedSpot',  430);
}

function flyMail() {
  const btnRect  = btn.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();

  const startX = btnRect.left + btnRect.width  / 2;
  const startY = btnRect.top  + btnRect.height / 2;
  const endX   = cardRect.left + cardRect.width  / 2;
  const endY   = cardRect.top  + cardRect.height / 2;

  const DURATION = 820;

  // Outer wrapper moves on X (linear)
  const mx = document.createElement('div');
  mx.className = 'flying-mail-x';
  mx.style.cssText = `left:${startX}px; top:${startY}px;`;

  // Inner moves on Y (arc up then down)
  const my = document.createElement('div');
  my.className = 'flying-mail-y';
  my.innerHTML = `
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none"
         stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <polyline points="2,4 12,13 22,4"/>
    </svg>`;

  mx.appendChild(my);
  document.body.appendChild(mx);

  // Trail dots along the path
  let trailTimer = 0;
  const trailInterval = setInterval(() => {
    trailTimer += 40;
    const t  = trailTimer / DURATION;
    if (t >= 1) { clearInterval(trailInterval); return; }
    const tx = lerp(startX, endX, t);
    const arcH = -180;
    const ty = lerp(startY, endY, t) + arcH * 4 * t * (1 - t);
    const dot = document.createElement('div');
    dot.className = 'trail';
    dot.style.cssText = `left:${tx-2.5}px; top:${ty-2.5}px; opacity:${0.6*(1-t)};`;
    document.body.appendChild(dot);
    setTimeout(() => dot.remove(), 400);
  }, 40);

  // X: linear
  mx.animate([
    { transform: 'translateX(-50%)' },
    { transform: `translateX(calc(-50% + ${endX - startX}px))` }
  ], { duration: DURATION, easing: 'linear', fill: 'forwards' });

  // Y: parabolic arc (ease-out up, ease-in down), with rotation
  const yAnim = my.animate([
    { transform: 'translateY(-50%) rotate(-12deg) scale(1)' },
    { transform: `translateY(calc(-50% - 180px)) rotate(-28deg) scale(1.18)`, offset: 0.38 },
    { transform: `translateY(calc(-50% + ${endY - startY}px)) rotate(8deg) scale(0.9)` }
  ], { duration: DURATION, easing: 'cubic-bezier(0.4, 0, 0.6, 1)', fill: 'forwards' });

  yAnim.onfinish = () => {
    // Impact
    spawnBurst(endX, endY);

    // Landing bounce on the envelope
    my.animate([
      { transform: `translateY(calc(-50% + ${endY - startY}px)) rotate(8deg) scale(0.9)` },
      { transform: `translateY(calc(-50% + ${endY - startY}px)) rotate(0deg) scale(1.2)` },
      { transform: `translateY(calc(-50% + ${endY - startY}px)) rotate(0deg) scale(1)` },
    ], { duration: 340, easing: 'cubic-bezier(0.34,1.56,0.64,1)', fill: 'forwards' })
    .onfinish = () => {
      mx.remove();
      clearInterval(trailInterval);

      // Swap card to success
      card.classList.add('confirmed');
      setTimeout(revealSuccess, 60);
    };
  };
}

function handleSubmit() {
  if (busy) return;
  busy = true;

  // Button launches
  btn.classList.add('launched');
  input.disabled = true;

  // Small delay then fly
  setTimeout(flyMail, 160);
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});
</script>
</body>
</html>
